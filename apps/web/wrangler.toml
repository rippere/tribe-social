# Cloudflare Pages project for the static PrePost site (npm run cf:deploy).
# Server code: functions/api/clip-chat.ts (Workers AI) and functions/api/waitlist.ts (KV).
name = "prepost"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# Waitlist signups (functions/api/waitlist.ts). One key per email: signup:<email>.
[[kv_namespaces]]
binding = "WAITLIST"
id = "d2d0c4cb3fed43b9a0029204168452f4"
