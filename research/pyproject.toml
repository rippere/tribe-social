[project]
name = "tribe-social"
version = "0.1.0"
description = "Neural content intelligence for short-form video — TRIBE v2 brain encoding scores mapped to engagement prediction"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "scipy>=1.17.1",
    "streamlit>=1.57.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "paramiko>=3.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "manim>=0.20.1",
    "playwright>=1.59.0",
]

[project.scripts]
tribe-score = "tribe_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tribe_score"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
